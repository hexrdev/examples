    # ============================================
    # INBOUND LISTENER - A2A traffic from mesh
    # Accepts mTLS connections from other agents' Envoy sidecars
    # ============================================
    - name: inbound_a2a_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 15006
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: inbound_a2a
                codec_type: AUTO
                route_config:
                  name: inbound_a2a_routes
                  virtual_hosts:
                    - name: a2a_service
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/a2a"
                          route:
                            cluster: local_a2a_sidecar
                            timeout: 300s
                        - match:
                            prefix: "/.well-known/"
                          route:
                            cluster: local_a2a_sidecar
                            timeout: 10s
                        - match:
                            prefix: "/health"
                          route:
                            cluster: local_a2a_sidecar
                            timeout: 5s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pivot-demo-quota
  namespace: tenant-pivot-demo
spec:
  hard:
    # Compute resources
    requests.cpu: "1"
    requests.memory: "2Gi"
    limits.cpu: "2"
    limits.memory: "2Gi"
    # Object limits
    pods: "5"
    services: "5"
    secrets: "10"
    configmaps: "10"
    persistentvolumeclaims: "5"
    # Storage
    requests.storage: "10Gi"
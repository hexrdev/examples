apiVersion: v1
kind: Namespace
metadata:
  name: tenant-globex-azure
  labels:
    hexr.io/tenant: "globex-azure"
    hexr.io/tenant-type: "customer"
    hexr.io/managed-by: "hexr-sdk"
    hexr.io/framework: "bespoke"
    hexr.io/target: "development"
  annotations:
    # Multi-tenancy configuration
    hexr.io/spire-identity-prefix: "tenant/globex-azure"
    hexr.io/credential-scope: "globex-azure-resources"
    hexr.io/network-isolation-level: "strict"
    # Agent metadata
    hexr.io/agent-name: "content-creation-crew-a2a"
    hexr.io/build-version: "0.1.0"
    # Cloud provider permissions
    hexr.io/cloud-providers: "aws"
spec:
  finalizers:
  - kubernetes
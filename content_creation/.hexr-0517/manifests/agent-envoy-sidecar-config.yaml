apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-envoy-sidecar-config
  namespace: tenant-pivot-demo
  labels:
    app: hexr-agent
    tenant: pivot-demo
    component: envoy-sidecar
data:
  envoy.yaml: |
    # Hexr Agent Envoy Sidecar Configuration
    # Agent: denial-review-crew-a2a
    # Tenant: pivot-demo
    # Trust Domain: agents.hexr.cloud
    # Generated by Hexr SDK
    #
    # This sidecar establishes mTLS to credential-injector for secure credential exchange.
    # Agent calls localhost:15001 -> Envoy -> mTLS -> credential-injector:8443
    
    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 9901
    
    node:
      id: "hexr-agent-denial-review-crew-a2a"
      cluster: "hexr-agent-mesh"
    
    static_resources:
      listeners:
        # ============================================
        # OUTBOUND LISTENER - Egress to credential-injector
        # Agents connect to localhost:15001 which proxies to credential-injector via mTLS
        # ============================================
        - name: outbound_mtls_listener
          address:
            socket_address:
              address: 127.0.0.1
              port_value: 15001
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: outbound_mtls
                    codec_type: AUTO
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                    route_config:
                      name: outbound_routes
                      virtual_hosts:
                        # Route to Credential Injector
                        - name: credential_injector
                          domains:
                            - "credential-injector"
                            - "credential-injector.hexr-system"
                            - "hexr-credential-injector"
                            - "hexr-credential-injector.hexr-system"
                            - "hexr-credential-injector.hexr-system.svc"
                            - "hexr-credential-injector.hexr-system.svc.cluster.local"
                            - "localhost"
                            - "*"
                          routes:
                            - match:
                                prefix: "/v1/credentials"
                              route:
                                cluster: credential_injector_mtls
                                timeout: 30s
                            - match:
                                prefix: "/v1/exchange"
                              route:
                                cluster: credential_injector_mtls
                                timeout: 30s
                            - match:
                                prefix: "/"
                              route:
                                cluster: credential_injector_mtls
                                timeout: 30s
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    
        # ============================================
        # INBOUND A2A mTLS LISTENER - Cross-cluster A2A ingress
        # Accepts mTLS connections from agents in the same trust domain.
        # Caller must present a valid SPIFFE SVID from: spiffe://agents.hexr.cloud/
        # Routes to local A2A sidecar at localhost:8090
        # ============================================
        - name: inbound_a2a_mtls_listener
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8443
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    tls_certificate_sds_secret_configs:
                      - name: "default"
                        sds_config:
                          resource_api_version: V3
                          api_config_source:
                            api_type: GRPC
                            transport_api_version: V3
                            grpc_services:
                              - envoy_grpc:
                                  cluster_name: spire_agent
                    combined_validation_context:
                      default_validation_context:
                        match_typed_subject_alt_names:
                          - san_type: URI
                            matcher:
                              prefix: "spiffe://agents.hexr.cloud/"
                      validation_context_sds_secret_config:
                        name: "ROOTCA"
                        sds_config:
                          resource_api_version: V3
                          api_config_source:
                            api_type: GRPC
                            transport_api_version: V3
                            grpc_services:
                              - envoy_grpc:
                                  cluster_name: spire_agent
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: inbound_a2a_mtls
                    codec_type: AUTO
                    forward_client_cert_details: SANITIZE_SET
                    set_current_client_cert_details:
                      uri: true
                      subject: true
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                    route_config:
                      name: inbound_a2a_routes
                      virtual_hosts:
                        - name: a2a_service
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/a2a"
                              route:
                                cluster: local_a2a_sidecar
                                timeout: 300s
                            - match:
                                prefix: "/.well-known/"
                              route:
                                cluster: local_a2a_sidecar
                                timeout: 10s
                            - match:
                                prefix: "/health"
                              route:
                                cluster: local_a2a_sidecar
                                timeout: 5s
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    
      clusters:
        # ============================================
        # SPIRE Agent - SDS provider for certificates
        # ============================================
        - name: spire_agent
          connect_timeout: 1s
          type: STATIC
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: spire_agent
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        pipe:
                          path: /run/spire/sockets/agent.sock
    
        # ============================================
        # Credential Injector with mTLS
        # ============================================
        - name: credential_injector_mtls
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: credential_injector_mtls
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: hexr-runtime-credential-injector.hexr-system.svc.cluster.local
                          port_value: 8443
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                # Present our certificate to credential-injector (via SPIRE SDS)
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                # Validate credential-injector's certificate (via SPIRE SDS)
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          prefix: "spiffe://agents.hexr.cloud/"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
    
        # ============================================
        # Local A2A Sidecar cluster
        # ============================================
        - name: local_a2a_sidecar
          connect_timeout: 1s
          type: STATIC
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: local_a2a_sidecar
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 8090

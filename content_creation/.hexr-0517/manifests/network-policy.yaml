apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pivot-demo-agent-isolation
  namespace: tenant-pivot-demo
spec:
  podSelector:
    matchLabels:
      hexr.io/tenant: "pivot-demo"
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Deny all inbound traffic (agents typically don't need incoming connections)
  - from: []
  egress:
  # Allow access to Hexr Runtime services
  - to:
    - namespaceSelector:
        matchLabels:
          name: hexr-system
    ports:
    - protocol: TCP
      port: 8080  # Credential Injector
    - protocol: TCP  
      port: 8081  # SPIRE Server (if needed)
    - protocol: TCP
      port: 6379  # Valkey L2 Cache
    - protocol: TCP
      port: 4317  # OTel Collector gRPC (OTLP traces)
    - protocol: TCP
      port: 4318  # OTel Collector HTTP (OTLP traces)
  # Allow external cloud provider APIs (OpenAI, AWS, etc)
  - ports:
    - protocol: TCP
      port: 443  # HTTPS
    - protocol: TCP
      port: 80   # HTTP
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
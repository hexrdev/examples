apiVersion: v1
kind: ResourceQuota
metadata:
  name: pivot-demo-quota
  namespace: tenant-pivot-demo
spec:
  hard:
    # Compute resources
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "8Gi"
    # Object limits
    pods: "20"
    services: "5"
    secrets: "10"
    configmaps: "10"
    persistentvolumeclaims: "5"
    # Storage
    requests.storage: "10Gi"